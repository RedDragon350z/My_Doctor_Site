<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MondoDottori - Prenota la tua visita online</title>
    <style>
        :root {
            --primary-color: #00875a;
            --primary-hover: #006644;
            --bg-light: #f4f6f8;
            --card-bg: #ffffff;
            --text-dark: #333333;
            --text-muted: #666666;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        /* Hero Section */
        .hero {
            background-color: var(--primary-color);
            color: white;
            padding: 40px 20px 80px;
            text-align: center;
        }

        .hero h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .hero p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Search Card Container */
        .search-container {
            max-width: 600px;
            margin: -50px auto 40px;
            padding: 0 15px;
        }

        .search-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        /* Tabs */
        .search-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: white;
            color: var(--text-dark);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: #e6f4ea;
        }

        /* Dropdown custom */
        .select-wrapper {
            position: relative;
            margin-bottom: 15px;
        }

        .select-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .select-input:focus {
            border-color: var(--primary-color);
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 280px;
            overflow-y: auto;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            z-index: 100;
            margin-top: 5px;
            display: none;
        }

        .dropdown-menu.open {
            display: block;
        }

        .dropdown-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background-color: #f5f5f5;
        }

        .item-icon {
            width: 32px;
            height: 32px;
            background-color: #e6f4ea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
        }

        /* Search Button */
        .search-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background-color: var(--primary-hover);
        }

        /* Section Lists */
        .section-container {
            max-width: 900px;
            margin: 0 auto 40px;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-dark);
        }

        .grid-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .grid-item {
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 0.95rem;
            color: var(--text-dark);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .grid-item:hover {
            border-color: var(--primary-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- Hero Header -->
    <div class="hero">
        <h1>Prenota la tua visita online!</h1>
        <p>Cerca tra 390 000 Specialisti e Medici di Medicina Generale.</p>
    </div>

    <!-- Search Form Card -->
    <div class="search-container">
        <div class="search-card">
            
            <div class="search-tabs">
                <button class="tab-btn active">🏢 In studio</button>
                <button class="tab-btn">📹 Online</button>
                <button class="tab-btn">💊 Farmacia</button>
            </div>

            <!-- Custom Dropdown per Specializzazioni -->
            <div class="select-wrapper">
                <div class="select-input" id="selectInput">
                    <span id="selectedText">es. prestazione, medico, struttura</span>
                    <span>▼</span>
                </div>

                <div class="dropdown-menu" id="dropdownMenu">
                    <!-- Lista popolata via JS -->
                </div>
            </div>

            <button class="search-btn">Cerca Dottore</button>

        </div>
    </div>

    <!-- Lista Completa Specializzazioni -->
    <div class="section-container">
        <h2 class="section-title">Specializzazioni e Mansioni</h2>
        <div class="grid-list" id="specialtiesGrid">
            <!-- Popolato via JS -->
        </div>
    </div>

    <script>
        // Lista completa estrapolata dagli screenshot
        const mansioni = [
            "Medico Di Medicina Generale", "Ginecologo", "Ortopedico", "Dermatologo", 
            "Nutrizionista", "Psicologo", "Oculista", "Urologo", "Otorino", "Cardiologo",
            "Dentista", "Chirurgo Generale", "Osteopata", "Internista", "Medico Estetico", 
            "Endocrinologo", "Gastroenterologo", "Neurologo", "Neurochirurgo", "Fisioterapista",
            "Psicoterapeuta", "Chirurgo Plastico", "Psichiatra", "Pediatra", "Podologo", 
            "Reumatologo", "Pneumologo", "Fisiatra", "Chirurgo Vascolare", "Andrologo",
            "Dietista", "Allergologo", "Radiologo", "Proctologo", "Ematologo", "Angiologo", 
            "Dietologo", "Senologo", "Geriatra", "Agopuntore", "Medico Dello Sport", 
            "Oncologo", "Pediatra Di Libera Scelta", "Nefrologo", "Diabetologo", 
            "Psicologo Clinico", "Chirurgo", "Logopedista", "Chirurgo Maxillo Facciale", 
            "Cardiochirurgo", "Chiropratico", "Medico Legale", "Neuropsichiatra Infantile", 
            "Anestesista", "Ortodontista", "Chirurgo Estetico", "Biologo Nutrizionista", 
            "Terapista Del Dolore", "Ostetrica", "Medico Competente", "Ecografista", 
            "Omeopata", "Infettivologo", "Radiologo Diagnostico", "Sessuologo", "Epatologo", 
            "Chirurgo Toracico", "Chirurgo Pediatrico", "Chirurgo Vertebrale", "Massofisioterapista",
            "Ortottista", "Posturologo", "Medico Certificatore", "Tricologo", "Tecnico Sanitario", 
            "Foniatra", "Terapeuta", "Infermiere", "Immunologo", "Igienista Dentale",
            "Professional Counselor", "Medico Genetista", "Biologo Della Riproduzione", 
            "Neuropsicologo", "Anatomopatologo", "Radioterapista", "Medico Nucleare", 
            "Chinesiologo", "Donazione Sangue", "Venereologo", "Stomatologo", "Massoterapista", 
            "Tecnico Radiologo", "Parodontologo", "Analista Clinico", "Covid Test", 
            "Medico Aeronautico", "Audioprotesista", "Epidemiologo", "Neuropsichiatra"
        ];

        const dropdownMenu = document.getElementById('dropdownMenu');
        const specialtiesGrid = document.getElementById('specialtiesGrid');
        const selectInput = document.getElementById('selectInput');
        const selectedText = document.getElementById('selectedText');

        // Popola il dropdown menu personalizzato con icona della borsa medica
        mansioni.forEach(item => {
            const div = document.createElement('div');
            div.className = 'dropdown-item';
            div.innerHTML = `
                <div class="item-icon">🧰</div>
                <span>${item}</span>
            `;
            div.onclick = () => {
                selectedText.innerText = item;
                dropdownMenu.classList.remove('open');
            };
            dropdownMenu.appendChild(div);

            // Popola anche la griglia in basso
            const gridAnchor = document.createElement('a');
            gridAnchor.className = 'grid-item';
            gridAnchor.href = '#';
            gridAnchor.innerHTML = `<span>🧰</span> <span>${item}</span>`;
            specialtiesGrid.appendChild(gridAnchor);
        });

        // Toggle apertura/chiusura dropdown
        selectInput.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('open');
        });

        // Chiudi il dropdown se si clicca fuori
        document.addEventListener('click', () => {
            dropdownMenu.classList.remove('open');
        });
    </script>
</body>
</html>
