<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuova password - Pronto Click Dottore</title>

    <meta name="supabase-url" content="https://ypkyyejpqwswtcmkcrct.supabase.co">
    <meta name="supabase-key" content="sb_publishable_5JTXGieh9s6LeGQy99ET1Q_AKYq_80v">

    <script src="theme.js"></script>
    <link rel="stylesheet" href="theme.css">

    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        skybrand: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0284c7', 600: '#0369a1', 700: '#075985', 800: '#0c4a6e', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        const metaValue = (name) => document.querySelector(`meta[name="${name}"]`)?.getAttribute('content') || '';
        const client = createClient(metaValue('supabase-url') || 'https://example.supabase.co', metaValue('supabase-key') || 'public-anon-key');
        window.supabase = client;

        // Supabase legge il token dal link e apre una sessione di recupero
        client.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
                window.dispatchEvent(new CustomEvent('pcd-recovery-ready'));
            }
        });
        client.auth.getSession().then(({ data }) => {
            if (data && data.session) window.dispatchEvent(new CustomEvent('pcd-recovery-ready'));
        });
    </script>
    <style>
        html { -webkit-text-size-adjust: 100%; }
        @media (max-width: 767px) { input, select, textarea { font-size: 16px !important; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">

    <header class="bg-white border-b border-slate-200 py-4 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <img src="logo.png" alt="Pronto Click Dottore" class="h-12 sm:h-14 w-auto max-w-full object-contain">
            </a>
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-sm font-semibold text-slate-500 hover:text-skybrand-600 flex items-center gap-2 transition">
                    <i class="fa-solid fa-arrow-left"></i> Torna alla Home
                </a>
                <button type="button" data-theme-toggle aria-label="Passa al tema scuro" title="Passa al tema scuro"
                class="theme-toggle w-10 h-10 flex items-center justify-center rounded-xl border border-slate-300 text-slate-700 hover:border-skybrand-400 hover:text-skybrand-600 transition">
                <i class="fa-solid fa-moon text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 lg:p-8">
        <div class="w-full max-w-md bg-white border border-slate-200/80 rounded-3xl p-8 sm:p-10 shadow-xl">
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-skybrand-50 text-skybrand-500 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900">Scegli una nuova password</h1>
                <p class="text-xs text-slate-500 mt-1">Inserisci la nuova password per il tuo account</p>
            </div>

            <div id="reset-loading" class="text-center text-sm text-slate-500 py-6">
                <i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Verifica del link in corso...
            </div>

            <div id="reset-invalid" class="hidden text-center space-y-4 py-2">
                <p class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-xl px-3.5 py-2.5">Il link non è valido o è scaduto. Richiedine uno nuovo.</p>
                <a href="password-dimenticata.html" class="inline-block bg-skybrand-500 hover:bg-skybrand-600 text-white font-semibold py-3 px-6 rounded-xl transition text-sm">Richiedi un nuovo link</a>
            </div>

            <form id="reset-form" class="hidden space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Nuova password</label>
                    <input type="password" id="new-password" required minlength="8" autocomplete="new-password" placeholder="Minimo 8 caratteri" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm bg-slate-50/50 focus:outline-none focus:ring-2 focus:ring-skybrand-200 focus:border-skybrand-400 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Ripeti la password</label>
                    <input type="password" id="confirm-password" required minlength="8" autocomplete="new-password" placeholder="Ripeti la password" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm bg-slate-50/50 focus:outline-none focus:ring-2 focus:ring-skybrand-200 focus:border-skybrand-400 transition">
                </div>

                <div id="reset-message" class="hidden text-sm rounded-xl px-3.5 py-2.5"></div>

                <div class="pt-2">
                    <button type="submit" id="reset-submit" class="w-full disabled:opacity-60 disabled:cursor-not-allowed bg-skybrand-500 hover:bg-skybrand-600 text-white font-semibold py-3 rounded-xl transition shadow-md shadow-skybrand-500/20 text-sm">
                        Salva nuova password
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-500 text-xs py-6 text-center border-t border-slate-800">
        &copy; 2026 - Pronto Click Dottore. Piattaforma Certificata per la Gestione Sanitaria.
    </footer>

    <script>
        var ready = false;

        function show(id) {
            ['reset-loading', 'reset-invalid', 'reset-form'].forEach(function (x) {
                document.getElementById(x).classList.toggle('hidden', x !== id);
            });
        }
        function showMessage(text, ok) {
            var box = document.getElementById('reset-message');
            box.textContent = text;
            box.className = 'text-sm rounded-xl px-3.5 py-2.5 ' + (ok
                ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                : 'bg-red-50 text-red-700 border border-red-200');
        }

        window.addEventListener('pcd-recovery-ready', function () {
            ready = true;
            show('reset-form');
        });
        // se dopo qualche secondo non c'è nessuna sessione di recupero, il link non è valido
        setTimeout(function () { if (!ready) show('reset-invalid'); }, 4000);

        document.getElementById('reset-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            var pw = document.getElementById('new-password').value;
            var pw2 = document.getElementById('confirm-password').value;
            var submitBtn = document.getElementById('reset-submit');

            if (pw.length < 8) { showMessage('La password deve avere almeno 8 caratteri.', false); return; }
            if (pw !== pw2) { showMessage('Le due password non coincidono.', false); return; }

            submitBtn.disabled = true;
            try {
                var result = await window.supabase.auth.updateUser({ password: pw });
                if (result.error) throw result.error;
                showMessage('Password aggiornata con successo. Ti stiamo riportando alla Home...', true);
                await window.supabase.auth.signOut();
                setTimeout(function () { window.location.href = 'index.html'; }, 2000);
            } catch (err) {
                var msg = /same|different/i.test(String(err.message)) ? 'La nuova password deve essere diversa da quella attuale.'
                    : /weak|short|characters/i.test(String(err.message)) ? 'La password è troppo debole: scegline una più lunga.'
                    : 'Non è stato possibile aggiornare la password. Richiedi un nuovo link e riprova.';
                showMessage(msg, false);
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
