<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password dimenticata - Pronto Click Dottore</title>

    <meta name="supabase-url" content="https://ypkyyejpqwswtcmkcrct.supabase.co">
    <meta name="supabase-key" content="sb_publishable_5JTXGieh9s6LeGQy99ET1Q_AKYq_80v">
    <meta name="captcha-site-key" content="0x4AAAAAAFr40XakFmDo_KUm">

    <script src="theme.js"></script>
    <link rel="stylesheet" href="theme.css">

    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        skybrand: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0284c7', 600: '#0369a1', 700: '#075985', 800: '#0c4a6e', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        const metaValue = (name) => document.querySelector(`meta[name="${name}"]`)?.getAttribute('content') || '';
        window.supabase = createClient(metaValue('supabase-url') || 'https://example.supabase.co', metaValue('supabase-key') || 'public-anon-key');
    </script>
    <style>
        html { -webkit-text-size-adjust: 100%; }
        @media (max-width: 767px) { input, select, textarea { font-size: 16px !important; } }
    </style>
    <script src="captcha.js" defer></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">

    <header class="bg-white border-b border-slate-200 py-4 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <img src="logo.png" alt="Pronto Click Dottore" class="h-12 sm:h-14 w-auto max-w-full object-contain">
            </a>
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-sm font-semibold text-slate-500 hover:text-skybrand-600 flex items-center gap-2 transition">
                    <i class="fa-solid fa-arrow-left"></i> Torna alla Home
                </a>
                <button type="button" data-theme-toggle aria-label="Passa al tema scuro" title="Passa al tema scuro"
                class="theme-toggle w-10 h-10 flex items-center justify-center rounded-xl border border-slate-300 text-slate-700 hover:border-skybrand-400 hover:text-skybrand-600 transition">
                <i class="fa-solid fa-moon text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 lg:p-8">
        <div class="w-full max-w-md bg-white border border-slate-200/80 rounded-3xl p-8 sm:p-10 shadow-xl">
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-skybrand-50 text-skybrand-500 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900">Password dimenticata</h1>
                <p class="text-xs text-slate-500 mt-1">Inserisci la tua email: ti invieremo un link per scegliere una nuova password</p>
            </div>

            <form id="forgot-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Email</label>
                    <input type="email" id="forgot-email" required autocomplete="email" inputmode="email" placeholder="mario.rossi@email.it" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm bg-slate-50/50 focus:outline-none focus:ring-2 focus:ring-skybrand-200 focus:border-skybrand-400 transition">
                </div>

                <div class="pt-2">
                    <div id="forgot-captcha" data-captcha class="min-h-[65px] flex justify-center"></div>
                </div>

                <div id="forgot-message" class="hidden text-sm rounded-xl px-3.5 py-2.5"></div>

                <div class="pt-2">
                    <button type="submit" id="forgot-submit" class="w-full disabled:opacity-60 disabled:cursor-not-allowed bg-skybrand-500 hover:bg-skybrand-600 text-white font-semibold py-3 rounded-xl transition shadow-md shadow-skybrand-500/20 text-sm">
                        Invia link di recupero
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center text-xs text-slate-500 border-t border-slate-100 pt-4">
                Ti sei ricordato? <a href="index.html" class="text-skybrand-600 font-semibold hover:underline">Torna alla Home</a>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-500 text-xs py-6 text-center border-t border-slate-800">
        &copy; 2026 - Pronto Click Dottore. Piattaforma Certificata per la Gestione Sanitaria.
    </footer>

    <script>
        function showMessage(text, ok) {
            var box = document.getElementById('forgot-message');
            box.textContent = text;
            box.className = 'text-sm rounded-xl px-3.5 py-2.5 ' + (ok
                ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                : 'bg-red-50 text-red-700 border border-red-200');
        }

        document.getElementById('forgot-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            var email = document.getElementById('forgot-email').value.trim();
            var submitBtn = document.getElementById('forgot-submit');

            if (!window.supabase) {
                showMessage('Il servizio non è ancora pronto. Attendi un istante e riprova.', false);
                return;
            }
            var captchaToken = window.PCDCaptcha ? window.PCDCaptcha.getToken('forgot-captcha') : '';
            if (!captchaToken) {
                showMessage('Completa la verifica di sicurezza prima di continuare.', false);
                return;
            }
            submitBtn.disabled = true;

            try {
                var result = await window.supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/reset-password.html',
                    captchaToken: captchaToken
                });
                if (result.error) throw result.error;
                // Messaggio volutamente generico: non rivela se l'email è registrata
                showMessage('Se l\'indirizzo è registrato, riceverai a breve un\'email con il link per scegliere una nuova password. Controlla anche la cartella spam.', true);
                document.getElementById('forgot-form').reset();
            } catch (err) {
                var msg = /captcha/i.test(String(err.message)) ? 'La verifica di sicurezza non è riuscita. Riprova.'
                    : /rate limit|too many|seconds/i.test(String(err.message)) ? 'Hai fatto troppe richieste. Attendi qualche minuto e riprova.'
                    : 'Non è stato possibile inviare l\'email. Riprova tra poco.';
                showMessage(msg, false);
            } finally {
                // il token è monouso: va sempre rigenerato
                if (window.PCDCaptcha) window.PCDCaptcha.reset('forgot-captcha');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
